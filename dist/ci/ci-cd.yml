# eOVPN-Pro CI/CD Pipeline
# خط لوله یکپارچه‌سازی و استقرار مداوم eOVPN-Pro
#
# Jobs:
#   1. test          - unit tests, linting, metadata validation
#   2. build-deb     - native .deb package (Ubuntu)
#   3. build-flatpak - sandboxed Flatpak package (tags / manual dispatch)
#   4. release       - attach .deb to GitHub Releases on version tags
#
# Only run flatpak job on tags / manual dispatch (builds NetworkManager from source)
# اجرای ساخت فلت‌پک تنها روی تگ‌ها/اجرای دستی (چون NetworkManager از سورس ساخته می‌شود)

name: eOVPN-Pro CI/CD Pipeline

on:
  push:
    branches: [master, main, arena/*]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests & Quality Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev \
            libnm-dev \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libsecret-1-dev \
            libnotify-dev \
            desktop-file-utils \
            appstream

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 cffi PyGObject

      - name: Validate desktop and metainfo files
        run: |
          desktop-file-validate data/com.github.mahdi-arts.eovpn-pro.desktop
          appstreamcli validate data/com.github.mahdi-arts.eovpn-pro.metainfo.xml || true

      - name: Lint with flake8
        run: |
          python3 -m flake8 eovpn tests run_program_debug.py cffi_compile.py meson_post_install.py

      - name: Compile all Python sources
        run: |
          python3 -m compileall -q eovpn tests run_program_debug.py cffi_compile.py meson_post_install.py

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover -s tests -v

  build-deb:
    name: Build Debian (.deb) Package
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            dh-python \
            meson \
            ninja-build \
            pkg-config \
            python3-all \
            python3-cffi \
            python3-gi \
            libnm-dev \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libsecret-1-dev \
            libnotify-dev \
            gettext \
            desktop-file-utils

      - name: Build Debian Package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Collect built packages
        run: |
          mkdir -p dist/packages
          cp ../*.deb dist/packages/ || true
          ls -la dist/packages/

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eovpn-pro-deb
          path: dist/packages/*.deb

  build-flatpak:
    name: Build Flatpak Package
    runs-on: ubuntu-24.04
    needs: test
    # Expensive job: only on tags or manual dispatch
    # کار پرهزینه: فقط روی تگ‌ها یا اجرای دستی
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: eovpn-pro.flatpak
          manifest-path: dist/flatpak/com.github.mahdi-arts.eovpn-pro.yml
          cache: true

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eovpn-pro-flatpak
          path: eovpn-pro.flatpak

  release:
    name: Publish Release Assets
    runs-on: ubuntu-24.04
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download .deb Artifact
        uses: actions/download-artifact@v4
        with:
          name: eovpn-pro-deb
          path: dist/packages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/packages/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
