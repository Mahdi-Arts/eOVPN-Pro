app-id: com.github.mahdi-arts.eovpn-pro
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: eovpn

finish-args:
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --filesystem=~/.cert:create
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --system-talk-name=org.freedesktop.NetworkManager
  - --system-talk-name=net.openvpn.v3.configuration
  - --system-talk-name=net.openvpn.v3.sessions
  - --system-talk-name=net.openvpn.v3.log
  - --device=dri

modules:
  - name: intltool
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
        sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd

  #- name: linux-pam
  #  buildsystem: autotools
  #  sources: 
  #    - type: archive
  #      url: https://github.com/linux-pam/linux-pam/releases/download/v1.5.3/Linux-PAM-1.5.3.tar.xz
  #      sha256: 7ac4b50feee004a9fa88f1dfd2d2fa738a82896763050cd773b3c54b0a818283

  - name: polkit
    buildsystem: meson
    config-opts:
      - -Dlibs-only=true
      - -Dauthfw=shadow
    cleanup:
      - /bin/*
      - /etc/pam.d
      - /etc/dbus-1
      - /share/dbus-1/system-services/*
      - /share/polkit-1
      - /lib/polkit-1
    sources:
      - type: archive
        url: https://github.com/polkit-org/polkit/archive/refs/tags/122.tar.gz
        sha256: 0d69656d60800835c3d7d1f0a8362b32e1ae3ace2875a35bb624296fc52d5dc4

  - name: udev
    config-opts:
      - --disable-hwdb
      - --disable-logging
      - --disable-gudev
      - --disable-introspection
      - --disable-keymap
      - --disable-mtd_probe
    cleanup:
      - /include
      - /etc
      - /libexec
      - /sbin
      - /lib/pkgconfig
      - /man
      - /share/aclocal
      - /share/doc
      - /share/gtk-doc
      - /share/man
      - /share/pkgconfig
      - '*.la'
      - '*.a'
    sources:
      - type: git
        url: 'https://github.com/eudev-project/eudev'
        commit: be7068512c7512fa67c64fbff3472ab140c277c8

  - name: libndp
    buildsystem: autotools
    sources:
      - type: archive
        url: 'https://libndp.org/files/libndp-1.8.tar.gz'
        sha256: 88ffb66ee2eb527f146f5c02f5ccbc38ba97d2b0d57eb46bfba488821ab0c02b

  - name: NetworkManager
    buildsystem: meson
    build-options:
      cflags: -ltinfo
      cxxflags: -ltinfo
    config-opts:
      - -Dlibaudit=no
      - -Ddbus_conf_dir=/app/etc/dbus-1/system.d
      - -Ddnsmasq=/usr/bin/true
      - -Ddocs=false
      - -Dintrospection=true
      - -Diptables=/usr/bin/true
      - -Dlibpsl=false
      - -Dmodem_manager=false
      - -Dnmtui=false
      - -Dovs=false
      - -Dppp=false
      - -Dqt=false
      - -Dselinux=false
      - -Dsession_tracking=no
      - -Dsystemdsystemunitdir=no
      - -Dsystemd_journal=false
      - -Dtests=no
      - -Dvapi=false
    sources:
      - type: git
        url: 'https://github.com/NetworkManager/NetworkManager.git'
        commit: abfd2d6ea729926bff0ddafa1367a54f6d6f4230

      - type: patch
        path: '0001-disable-ownership-check-for-plugins.patch'

  - name: libnma
    buildsystem: meson
    config-opts:
      - -Dmobile_broadband_provider_info=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      - -Dvapi=false
    sources:
      - type: git
        url: 'https://gitlab.gnome.org/GNOME/libnma.git'
        commit: 8f21d3b1f6825d2dad37f203649ac79e0e6ff171


  - name: NetworkManager-openvpn
    buildsystem: autotools
    sources:
      - type: git
        url: 'https://github.com/NetworkManager/NetworkManager-openvpn.git'
        commit: 428aa26bc05cac4cf418624128bb10c9d4003e5d

  - name: jsoncpp
    buildsystem: meson
    sources:
      - type: git
        url: 'https://github.com/open-source-parsers/jsoncpp.git'
        commit: 5defb4ed1a4293b8e2bf641e16b156fb9de498cc

  - name: libcap-ng
    buildsystem: autotools
    sources:
      - type: git
        url: 'https://github.com/stevegrubb/libcap-ng'
        commit: 03b8572843b36bf071776a311c61f8d1dcfc4d53

  - name: tinyxml2
    buildsystem: meson
    sources:
      - type: git
        url: 'https://github.com/leethomason/tinyxml2'
        commit: 1dee28e51f9175a31955b9791c74c430fe13dc82

  - name: python-dbus
    buildsystem: meson
    config-opts:
      - -Dtests=false
    sources:
      - type: archive
        url: https://dbus.freedesktop.org/releases/dbus-python/dbus-python-1.4.0.tar.xz
        sha256: c36b28f10ffcc8f1f798aca973bcc132f91f33eb9b6b8904381b4077766043d5

  - name: gdus++
    buildsystem: meson
    config-opts:
      - -Dwerror=false
    sources:
      - type: git
        url: https://codeberg.org/OpenVPN/gdbuspp.git
        commit: 96f7fb688ed2dea3f192c63c5fe283dbe4900f16
  
  - name: libnl
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/thom311/libnl.git
        commit: 43878680c994989f16637dc47be19bb8dc154985
  
  - name: protobuf
    buildsystem: cmake
    sources:
      - type: git
        url: https://github.com/protocolbuffers/protobuf
        commit: 4b0c3aacf0657fbf38253b38918d3358dd4319ec

  - name: openvpn3
    buildsystem: meson
    config-opts:
      - -Dunit_tests=disabled
      - -Dtest_programs=disabled
      - -Ddbus_policy_dir=/tmp
      - -Ddbus_system_service_dir=/tmp
      - -Dwerror=false
    sources:
      - type: git
        url: 'https://codeberg.org/OpenVPN/openvpn3-linux.git'
        commit: 8bba2a15088bd0ef9c2f18ff29186e890a010add
      
      - type: patch
        path: 0001-openvpn3-linux-v24.1.patch

  - python3-cffi.json

  - name: eovpn
    buildsystem: meson
    config-opts:
      - "-Dopenvpn3=true"
    sources:
      - type: dir
        path: "../../"
