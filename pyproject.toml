# eOVPN-Pro Python Project Configuration
# پیکربندی پروژه پایتون eOVPN-Pro
#
# Central configuration for meson-python, ruff, mypy and other Python tooling.
# پیکربندی متمرکز meson-python، ruff، mypy و سایر ابزارهای پایتون.

[build-system]
requires = ["meson-python>=0.16.0", "meson>=0.60.0", "ninja", "cffi>=1.16.0"]
build-backend = "mesonpy"

[project]
name = "eovpn-pro"
version = "1.5.0"
description = "Advanced, high-performance OpenVPN configuration manager built with GTK4 and Libadwaita."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Mahdi Bagheban", email = "info@MahdiArts.ir" },
]
keywords = ["openvpn", "vpn", "gtk4", "libadwaita", "networkmanager", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "cffi>=1.16.0",
    "PyGObject>=3.42.0",
]

[project.urls]
Homepage = "https://github.com/Mahdi-Arts/eOVPN-Pro"
Repository = "https://github.com/Mahdi-Arts/eOVPN-Pro"
Issues = "https://github.com/Mahdi-Arts/eOVPN-Pro/issues"
Changelog = "https://github.com/Mahdi-Arts/eOVPN-Pro/blob/master/CHANGELOG.md"

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = [
    ".git",
    "__pycache__",
    "build",
    "build-appimage",
    "dist/packages",
    ".flatpak-builder",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "SIM"]
ignore = [
    "E402",
    "E203",
    "N801",
    "N802",
    "N803",
    "N812",
    "N818",
]

# The /proc/net/dev fixture lines mirror the real kernel format verbatim.
# خطوط فیکسچر /proc/net/dev عیناً قالب واقعی هسته را بازتاب می‌دهند.
[tool.ruff.lint.per-file-ignores]
"tests/test_network_monitor.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = false
exclude = ["build/", "build-appimage/", "dist/", ".flatpak-builder/"]

[[tool.mypy.overrides]]
module = ["gi.*", "cffi.*", "openvpn3.*"]
ignore_missing_imports = true

# Deterministic wheel builds: the OpenVPN 3 backend is not part of the
# wheel story, so the meson-python backend is pinned to the same option
# every distribution package uses.
# ساخت‌های wheel قطعی: بک‌اند OpenVPN 3 بخشی از داستان wheel نیست، بنابراین
# بک‌اند meson-python روی همان آپشنی قفل می‌شود که همه بسته‌های توزیع‌ها دارند.
[tool.meson-python.args]
setup = ["-Dopenvpn3=false"]

# Coverage is scoped to the pure, offline-testable modules; GTK controllers
# are exercised manually and via the smoke builds (see docs/ARCHITECTURE.md).
# پوشش کد به ماژول‌های خالص و قابل تست آفلاین محدود است؛ کنترلرهای GTK از طریق
# اجرای دستی و ساخت‌های آزمایشی بررسی می‌شوند (رجوع کنید به docs/ARCHITECTURE.md).
[tool.coverage.run]
source = ["eovpn"]

[tool.coverage.report]
include = [
    "eovpn/utils.py",
    "eovpn/speed_test.py",
    "eovpn/auto_connect.py",
    "eovpn/cascade.py",
    "eovpn/cascade_controller.py",
    "eovpn/network_monitor.py",
    "eovpn/ip_lookup/*",
]
show_missing = true
